<style>

.review-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding-right:4px}

.retry-btn{margin-top:18px;width:100%;padding:13px;background:linear-gradient(135deg,#4299e1,#3182ce);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer}
.retry-btn:hover{opacity:.9}
.home-link{display:block;text-align:center;margin-top:14px;color:#4299e1;font-size:.84rem;text-decoration:none}
.home-link:hover{text-decoration:underline}
.submit-status{margin-top:12px;text-align:center;font-size:.78rem;color:#a0aec0}
.hidden{display:none}
@media (max-width:480px){.card{padding:20px 16px}}

<div class="wrap">

      <div class="score-big" id="scoreBig"></div>

<script>
/* ===== 単元データ ===== */
const FIGS={};
const UNIT={code:"131",title:"イオン結合とイオン結晶",sub:"教科書 p.64〜68｜イオン結合・組成式と名称・イオン結晶・電離｜毎回ランダム12問"};

const KC={
  K1:{short:"結合の判定",name:"金属元素と非金属元素の組合せからイオン結合だと判定できる"},
  K2:{short:"イオンの価数",name:"単原子イオンの化学式と価数を答えられる"},
  K3:{short:"多原子イオン",name:"多原子イオンの化学式と名称を答えられる"},
  K4:{short:"組成式づくり",name:"イオンの組合せから組成式を作れる"},
  K5:{short:"名称",name:"組成式から名称を、名称から組成式を書ける"},
  K6:{short:"イオン結晶の性質",name:"イオン結晶の性質を、その構造から説明できる"},
  K7:{short:"静電気力と融点",name:"静電気力の強さと融点の関係を説明できる"},
  K8:{short:"電離と電解質",name:"電離・電解質・非電解質を区別し、電気伝導性と結びつけられる"},
  K9:{short:"所在と用途",name:"代表的なイオンからなる物質を、所在・用途から特定できる"}
};

const TAG={
  cross:{name:"たすき掛けの向き",back:"K4",advice:"価数の数字は<b>相手の右下</b>に書きます。Al<sup>3+</sup> と O<sup>2−</sup> なら Al が2個、O が3個。まず価数を書き出してから向きを決めましょう。"},
  valence:{name:"価数落ち",back:"K2",advice:"2価・3価のイオンを1価として扱っています。組成式を作る前に、両方のイオンの価数を必ず口に出して確認する習慣を。"},
  paren:{name:"括弧忘れ",back:"K4",advice:"多原子イオンが2個以上あるときは (OH)<sub>2</sub> のように括弧でくくります。括弧がないと原子の数の意味が変わってしまいます。"},
  ratio:{name:"最小比にしていない",back:"K4",advice:"組成式の数字は<b>最も簡単な整数比</b>にします。たすき掛けで 2：2 と出たら、必ず 1：1 に約分しましょう。"},
  order:{name:"名称の順序",back:"K5",advice:"名称は<b>陰イオン→陽イオン</b>の順に読み、組成式とは逆向きになります。CaCl<sub>2</sub> は「塩化カルシウム」。"},
  molecule:{name:"分子と混同",back:"K6",advice:"イオンからなる物質に分子は存在しません。組成式は個数の比を表すだけなので、「二」「三」などの数詞も付けません。"},
  bondtype:{name:"結合の種類の取り違え",back:"K1",advice:"金属＋非金属＝イオン結合、非金属どうし＝共有結合、金属どうし＝金属結合。まず元素の種類を見分けましょう。"},
  conduct:{name:"電気伝導の条件混同",back:"K6",advice:"イオン結晶は固体では電気を通さず、水に溶かすか融かすと通します。イオンが動けるかどうかが分かれ目です。"},
  polyion:{name:"多原子イオンの取り違え",back:"K3",advice:"硫酸イオン SO<sub>4</sub><sup>2−</sup> と硫化物イオン S<sup>2−</sup>、炭酸イオンと炭酸水素イオンなど、よく似た名前を区別して覚えましょう。"},
  electrolyte:{name:"電解質と非電解質の取り違え",back:"K8",advice:"水に溶けて電離する物質が電解質、電離しない物質が非電解質です。スクロースやエタノールは溶けても電離しないので電気を通しません。"},
  solubility:{name:"溶けにくい塩の例外",back:"K8",advice:"イオンからなる物質には水に溶けやすいものが多いのですが、CaCO<sub>3</sub>・BaSO<sub>4</sub>・AgCl は溶けにくい例外です。この3つは覚えてしまいましょう。"},
  usage:{name:"用途と物質の取り違え",back:"K9",advice:"重曹は炭酸水素ナトリウム、生石灰は酸化カルシウム、消石灰は水酸化カルシウムです。別名と化学式をセットで覚えましょう。"}
};

const POOL=[
/* ===== K1 結合の判定（9問） ===== */
{kc:"K1",lv:1,q:"次のうち、イオン結合でできている物質はどれか。",
 c:[{t:"塩化ナトリウム NaCl"},{t:"二酸化炭素 CO<sub>2</sub>",tag:"bondtype"},{t:"銅 Cu",tag:"bondtype"},{t:"ダイヤモンド C",tag:"bondtype"}],a:0,
 h:"それぞれの物質がどの種類の元素からできているかを見ます。金属元素と非金属元素の組合せはどれか。",
 e:"イオン結合は<b>金属元素と非金属元素</b>の間にできる。NaCl はナトリウム（金属）と塩素（非金属）の組合せ。CO<sub>2</sub> は共有結合、Cu は金属結合。"},
{kc:"K1",lv:1,q:"酸化マグネシウム MgO をつくっている結合はどれか。",
 c:[{t:"イオン結合"},{t:"共有結合",tag:"bondtype"},{t:"金属結合",tag:"bondtype"},{t:"分子間力"}],a:0,
 h:"Mg は金属元素、O は非金属元素です。この組合せでできる結合を考えます。",
 e:"Mg（金属）と O（非金属）の組合せなので<b>イオン結合</b>。Mg<sup>2+</sup> と O<sup>2−</sup> が静電気力で引き合っている。"},
{kc:"K1",lv:1,q:"次のうち、共有結合だけでできている物質はどれか。",
 c:[{t:"水 H<sub>2</sub>O"},{t:"塩化カリウム KCl",tag:"bondtype"},{t:"酸化カルシウム CaO",tag:"bondtype"},{t:"鉄 Fe",tag:"bondtype"}],a:0,
 h:"非金属元素どうしの組合せを探します。",
 e:"H も O も非金属元素なので、H<sub>2</sub>O は<b>共有結合</b>でできた分子。KCl・CaO は金属＋非金属でイオン結合、Fe は金属結合。"},
{kc:"K1",lv:2,q:"イオン結合ができるのは、どのような元素の組合せのときか。",
 c:[{t:"陽性の強い金属元素と、陰性の強い非金属元素"},{t:"非金属元素どうし",tag:"bondtype"},{t:"金属元素どうし",tag:"bondtype"},{t:"貴ガス元素どうし"}],a:0,
 h:"電子を放しやすい元素と、電子を受け取りやすい元素の組合せを考えます。",
 e:"陽イオンになりやすい<b>金属元素</b>と、陰イオンになりやすい<b>非金属元素</b>が出会うと、電子の受け渡しが起きてイオン結合ができる。"},
{kc:"K1",lv:2,q:"塩化カリウム KCl において、K と Cl の間で起きていることはどれか。",
 c:[{t:"K が電子を1個放して K<sup>+</sup> に、Cl がそれを受け取って Cl<sup>−</sup> になり、両者が引き合う"},{t:"K と Cl が電子を1個ずつ出しあって共有する",tag:"bondtype"},{t:"自由電子が K と Cl を結びつけている",tag:"bondtype"},{t:"KCl 分子どうしが分子間力で引き合っている",tag:"molecule"}],a:0,
 h:"金属元素と非金属元素の間では、電子は共有されるのか、受け渡されるのかを考えます。",
 e:"イオン結合は<b>電子の受け渡し</b>で生じる。K は価電子1個を放して K<sup>+</sup>、Cl はそれを受け取って Cl<sup>−</sup> となり、静電気力で引き合う。"},
{kc:"K1",lv:2,q:"次のうち、金属結合でできているものはどれか。",

const PASS_RATE=0.8, N_L1=3, N_L2=4, N_L3=3;
let session=[], idx=0, records=[], studentId="", attempt=1;

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function el(id){return document.getElementById(id);}

function pickLevel(lv,n,used,usedKc){
  const pool=shuffle(POOL.map((it,i)=>i).filter(i=>POOL[i].lv===lv&&used.indexOf(i)<0));
  const out=[];
  // まだ出ていないKCを優先
  pool.forEach(i=>{ if(out.length<n && usedKc.indexOf(POOL[i].kc)<0){out.push(i);usedKc.push(POOL[i].kc);} });
  pool.forEach(i=>{ if(out.length<n && out.indexOf(i)<0) out.push(i); });
  out.forEach(i=>used.push(i));
  return out.slice(0,n);
}
function mkMcq(i){
  const it=POOL[i], order=shuffle(it.c.map((_,j)=>j));
  return {type:"mcq",src:it,order:order,a:order.indexOf(it.a)};
}
function mkStep(def){
  return {type:"step",src:def,sub:0,subResults:[],
    steps:def.steps.map(st=>{const o=shuffle(st.c.map((_,j)=>j));return {src:st,order:o,a:o.indexOf(st.a)};})};
}
function buildSession(){
  const used=[],usedKc=[];
  const l1=pickLevel(1,N_L1,used,usedKc), l2=pickLevel(2,N_L2,used,usedKc), l3=pickLevel(3,N_L3,used,usedKc);
  const fill=shuffle(STEPS.filter(s=>s.fill))[0], free=shuffle(STEPS.filter(s=>!s.fill))[0];
  const s=[];
  l1.forEach(i=>s.push(mkMcq(i)));
  l2.forEach(i=>s.push(mkMcq(i)));
  s.push(mkStep(fill));
  l3.forEach(i=>s.push(mkMcq(i)));
  s.push(mkStep(free));
  return s;
}

function toHalfWidthDigits(s){return s.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});}
function startQuiz(){
  studentId=toHalfWidthDigits((el('studentId').value||'').trim());
  if(!/^(20(0[0-9]|10)|1[1-6](0[1-9]|[1-3][0-9]|40))$/.test(studentId)){
    alert("学籍番号が正しくありません。\n1桁目は学年「1」、2桁目は組「1〜6」、3・4桁目は出席番号「01〜40」です（例：1年1組4番→1104）。");
    el('studentId').focus(); return;
  }
  el('studentId').value=studentId;
  try{localStorage.setItem('quizStudentId',studentId);}catch(e){}
  session=buildSession(); idx=0; records=[];
  el('start').classList.add('hidden'); el('result').classList.add('hidden');
  el('quiz').classList.remove('hidden');
  window.scrollTo(0,0); render();
}
function lvChip(lv){return `<span class="chip l${lv}">${lv===1?'基本':(lv===2?'標準':'発展')}</span>`;}
function figHtml(key){
  if(!key||!FIGS[key]) return '';
  return `<img class="qfig" src="${FIGS[key].src}" alt="${FIGS[key].alt}">`;
}

function render(){
  const item=session[idx]; attempt=1;
  el('pbar').style.width=(idx/session.length*100)+'%';
  el('qnum').textContent=`${idx+1} / ${session.length}`;
  el('hint').style.display='none'; el('exp').style.display='none';
  el('nextBtn').style.display='none';
  el('stepDone').innerHTML=''; el('stemBox').innerHTML=''; el('figBox').innerHTML='';
  if(item.type==='mcq'){
    const it=item.src;
    el('metaRow').innerHTML=`<span class="chip kc">${KC[it.kc].short}</span>${lvChip(it.lv)}`;
    el('figBox').innerHTML=figHtml(it.fig);
    el('qtext').innerHTML=it.q;
    el('choices').innerHTML=item.order.map((oi,k)=>
      `<button class="choice-btn" data-k="${k}" onclick="answerMcq(${k})">${it.c[oi].t}</button>`).join('');
  }else{ renderStep(); }
}
function renderStep(){
  const item=session[idx], def=item.src, st=item.steps[item.sub];
  el('metaRow').innerHTML=`<span class="chip kc">${KC[def.kc].short}</span>${lvChip(def.lv)}`+
    (def.fill?`<span class="chip fill">穴埋め（S1・S2 は提示）</span>`:`<span class="chip fill">ステップ分解</span>`);
  el('stemBox').innerHTML=`<div class="stem">${def.stem}</div>`;
  el('figBox').innerHTML=figHtml(def.fig);
  let done=(def.given||[]).map(g=>`<div class="step-row given"><span class="step-tag">${g.label}</span><span>${g.text}</span></div>`);
  item.subResults.forEach((r,i)=>{
    const s=item.steps[i];
    done.push(`<div class="step-row ${r.score<1?'miss':''}"><span class="step-tag">${s.src.label}</span><span>${s.src.c[s.src.a].t}${r.score<1?'　<b>（誤答→修正）</b>':''}</span></div>`);
  });
  el('stepDone').innerHTML=done.join('');
  el('qtext').innerHTML=`<span style="color:#6b46c1">［${st.src.label}］</span> ${st.src.q}`;
  el('choices').innerHTML=st.order.map((oi,k)=>
    `<button class="choice-btn" data-k="${k}" onclick="answerStep(${k})">${st.src.c[oi].t}</button>`).join('');
}
function judge(chosenK, srcQ, orderArr, correctK, onDone){
  const btns=[...el('choices').querySelectorAll('.choice-btn')];
  if(chosenK===correctK){
    btns.forEach(b=>b.disabled=true); btns[chosenK].classList.add('correct');
    onDone(attempt===1?1:0.5,null); showExp(srcQ); return;
  }
  const tag=srcQ.c[orderArr[chosenK]].tag||null;
  btns[chosenK].classList.add('wrong'); btns[chosenK].disabled=true;
  if(attempt===1){
    attempt=2;
    el('hint').innerHTML=`<span class="hl">ヒント</span>${srcQ.h}`;
    el('hint').style.display='block';
    onDone(null,tag);
  }else{
    btns.forEach(b=>b.disabled=true); btns[correctK].classList.add('correct');
    onDone(0,tag); showExp(srcQ);
  }
}
function showExp(srcQ){
  el('exp').innerHTML=`<b>解説</b>　${srcQ.e}`;
  el('exp').style.display='block';
  el('nextBtn').style.display='block';
  el('nextBtn').textContent=(idx===session.length-1&&!isMidStep())?'結果を見る →':'次へ →';
}
function isMidStep(){const it=session[idx];return it.type==='step'&&it.sub<it.steps.length-1;}
function answerMcq(k){
  const item=session[idx], it=item.src;
  if(!item.tags) item.tags=[];
  judge(k,it,item.order,item.a,(score,tag)=>{
    if(tag) item.tags.push(tag);
    if(score!==null) records.push({kc:it.kc,lv:it.lv,q:it.q,fig:it.fig,correct:it.c[it.a].t,score:score,tags:item.tags.slice(),exp:it.e,label:null});
  });
}
function answerStep(k){
  const item=session[idx], st=item.steps[item.sub];
  if(!st.tags) st.tags=[];
  judge(k,st.src,st.order,st.a,(score,tag)=>{
    if(tag) st.tags.push(tag);
    if(score!==null) item.subResults.push({score:score,tags:st.tags.slice()});
  });
}
function next(){
  const item=session[idx];
  if(item.type==='step'&&item.sub<item.steps.length-1){
    item.sub++; attempt=1;
    el('hint').style.display='none'; el('exp').style.display='none'; el('nextBtn').style.display='none';
    renderStep(); return;
  }
  if(item.type==='step'){
    const sc=item.subResults.map(r=>r.score);
    const avg=sc.reduce((a,b)=>a+b,0)/sc.length;
    const tags=item.subResults.reduce((a,r)=>a.concat(r.tags),[]);
    const detail=item.steps.map((s,i)=>`${s.src.label}：${item.subResults[i].score===1?'○':(item.subResults[i].score===0.5?'△':'×')}`).join('　');
    records.push({kc:item.src.kc,lv:item.src.lv,q:item.src.stem,fig:item.src.fig,correct:detail,score:avg,tags:tags,exp:item.steps[item.steps.length-1].src.e,label:'ステップ問題'});
  }
  idx++;
  if(idx>=session.length){ showResult(); return; }
  render();
}
function stripTags(x){return String(x).replace(/<[^>]+>/g,"");}
function send(pt,full){
  const st=el('submitStatus');
  if(!GAS_URL){ if(st) st.textContent="※送信先が未設定のため、この結果は記録されていません"; return; }
  const payload={studentId:studentId,quizName:UNIT.code+" "+UNIT.title,score:pt,total:full,
    passed:(full&&pt/full>=PASS_RATE)?"合格":"不合格",timestamp:new Date().toISOString(),
    missed:records.filter(r=>r.score<1).map(r=>stripTags(r.q))};
  try{
    fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(payload)});
    if(st) st.textContent="学籍番号: "+studentId+"｜記録しました";
  }catch(err){ if(st) st.textContent="※通信エラーのため記録できませんでした"; }
}
function showResult(){
  el('quiz').classList.add('hidden'); el('result').classList.remove('hidden');
  window.scrollTo(0,0);
  const total=records.length;
  const raw=records.reduce((a,r)=>a+r.score,0);
  const score=Math.round(raw*2)/2, rate=score/total;
  el('scoreBig').textContent=score+'点';
  el('scoreSub').textContent=`/ ${total}点（正答率 ${Math.round(rate*100)}%）`;
  el('donutArc').setAttribute('stroke-dasharray',`${(rate*100).toFixed(1)} ${(100-rate*100).toFixed(1)}`);
  const pass=rate>=PASS_RATE;
  const pb=el('passBadge');
  pb.textContent=pass?'合格':'もう一度'; pb.className='pass-badge '+(pass?'pass':'fail');

  const agg={};
  records.forEach(r=>{(agg[r.kc]=agg[r.kc]||{s:0,n:0});agg[r.kc].s+=r.score;agg[r.kc].n++;});
  el('kcList').innerHTML=Object.keys(KC).filter(k=>agg[k]).map(k=>{
    const p=agg[k].s/agg[k].n;
    const cls=p>=0.8?'ok':(p>=0.5?'mid':'ng'), mark=p>=0.8?'○':(p>=0.5?'△':'×');
    const col=p>=0.8?'#48bb78':(p>=0.5?'#ed8936':'#f56565');
    return `<div class="kc-row"><div class="kc-mark ${cls}">${mark}</div>
      <div class="kc-body"><div class="kc-name">${KC[k].name}</div>
      <div class="kc-bar"><i style="width:${Math.round(p*100)}%;background:${col}"></i></div></div>
      <div class="kc-score">${Math.round(agg[k].s*10)/10}/${agg[k].n}</div></div>`;
  }).join('');

  const tc={};
  records.forEach(r=>r.tags.forEach(t=>{tc[t]=(tc[t]||0)+1;}));
  const tags=Object.keys(tc).sort((a,b)=>tc[b]-tc[a]).slice(0,3);
  el('tagList').innerHTML=tags.length?tags.map(t=>
    `<div class="tag-row"><div class="tag-head"><span class="tag-name">${TAG[t].name}</span><span class="tag-count">${tc[t]}回</span></div>
     <div class="tag-advice">${TAG[t].advice}<br><span style="opacity:.7">戻る先：${KC[TAG[t].back].name}</span></div></div>`).join('')
    :`<div class="empty">今回、決まった型のミスは見つかりませんでした。</div>`;

  const weak=Object.keys(KC).filter(k=>agg[k]&&agg[k].s/agg[k].n<0.8);
  let todo='';
  if(pass&&weak.length===0){
    todo=`合格ラインを超え、測定したすべての力が8割に届いています。<b>3日後にもう一度</b>挑戦して、別の日に2回続けて合格できるか確かめましょう。それで「定着」と判定します。`;
  }else if(pass){
    todo=`合格ラインは超えています。ただし次の力はまだ8割に届いていません。<br>`+
      weak.map(k=>`・<b>${KC[k].name}</b>`).join('<br>')+`<br><br>次の回では、この力を優先して出題します。`;
  }else{
    todo=`合格ライン（正答率80%）に届きませんでした。まず次の力から復習しましょう。<br>`+
      weak.map(k=>`・<b>${KC[k].name}</b>`).join('<br>')+`<br><br><b>明日もう一度</b>、この回に挑戦してください。`;
  }
  if(tags.length) todo+=`<br><br>特に <b>${TAG[tags[0]].name}</b> の直し方を、板書ノートで確認しておくこと。`;
  el('todoBox').innerHTML=todo;

  el('sumSec').innerHTML = (typeof SUMMARY!=='undefined'&&SUMMARY)
    ? `<div class="sec-title">要点まとめ</div><div class="sum-wrap">${SUMMARY}</div>` : '';

  send(score,total);

  el('reviewList').innerHTML=records.map((r,i)=>{
    const cls=r.score===1?'':(r.score>0?'half':'miss');
    const mark=r.score===1?'○':(r.score>0?'△':'×');
    return `<div class="review-item ${cls}">
      <div class="rq">${mark} Q${i+1}${r.label?`（${r.label}）`:''}　${r.q}</div>
      <div class="ra"><b>正解：</b>${r.correct}<br>${r.exp}</div></div>`;
  }).join('');
}
</script>
</body>
</html>
