<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化学基礎クイズ｜124 周期律と周期表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;background:#f0f4f8;color:#2d3748;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:16px}
.wrap{width:100%;max-width:680px}
.card{background:#fff;border-radius:16px;padding:26px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
sub{font-size:.72em}sup{font-size:.72em}
img.qfig{display:block;width:100%;max-width:460px;margin:0 auto 14px;border:1px solid #e2e8f0;border-radius:8px;background:#fff}
#start h1{font-size:1.35rem;font-weight:700;color:#2b6cb0;margin-bottom:6px}
#start .sub{color:#718096;font-size:.9rem;margin-bottom:16px;line-height:1.6}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.74rem;font-weight:600;background:#ebf8ff;color:#2b6cb0}
.badge.key{background:#2b6cb0;color:#fff}
.flow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;background:#f7fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;margin-bottom:16px;font-size:.74rem;color:#4a5568}
.flow b{background:#fff;border:1px solid #cbd5e0;border-radius:5px;padding:3px 8px;font-weight:700}
.flow i{color:#a0aec0;font-style:normal}
.kc-preview{background:#f7fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:16px}
.kc-preview .t{font-size:.78rem;font-weight:700;color:#4a5568;margin-bottom:8px}
.kc-preview ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.kc-preview li{font-size:.82rem;color:#4a5568;padding-left:16px;position:relative;line-height:1.5}
.kc-preview li::before{content:"";position:absolute;left:0;top:.45em;width:7px;height:7px;border-radius:50%;background:#90cdf4}
.id-label{display:block;font-size:.82rem;font-weight:600;color:#4a5568;margin-bottom:6px}
.id-input{width:100%;padding:12px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:.95rem;margin-bottom:16px}
.id-input:focus{outline:none;border-color:#4299e1}
.start-btn{width:100%;padding:14px;background:linear-gradient(135deg,#4299e1,#3182ce);color:#fff;border:none;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer}
.start-btn:hover{opacity:.9}
#quiz .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.progress-wrap{flex:1;height:8px;background:#e2e8f0;border-radius:4px;margin:0 12px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#4299e1,#63b3ed);border-radius:4px;transition:width .3s}
.q-num{font-size:.8rem;color:#718096;white-space:nowrap}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:6px}
.chip.kc{background:#edf2f7;color:#4a5568}
.chip.l1{background:#f0fff4;color:#276749}
.chip.l2{background:#ebf8ff;color:#2b6cb0}
.chip.l3{background:#faf5ff;color:#6b46c1}
.chip.fill{background:#fffaf0;color:#975a16}
.q-text{font-size:1.05rem;font-weight:600;line-height:1.65;margin-bottom:14px}
.stem{background:#f7fafc;border-left:4px solid #90cdf4;border-radius:0 8px 8px 0;padding:10px 14px;font-size:.89rem;line-height:1.6;color:#4a5568;margin-bottom:12px}
.step-done{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.step-row{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;padding:9px 12px;border-radius:8px;background:#f0fff4;border:1px solid #c6f6d5;line-height:1.5}
.step-row.given{background:#fffaf0;border-color:#feebc8}
.step-row.miss{background:#fff5f5;border-color:#fed7d7}
.step-tag{font-weight:700;color:#4a5568;white-space:nowrap}
.choices{display:flex;flex-direction:column;gap:9px}
.choice-btn{padding:13px 16px;border:2px solid #e2e8f0;border-radius:10px;background:#fff;font-size:.95rem;cursor:pointer;text-align:left;transition:all .15s;line-height:1.5}
.choice-btn:hover:not(:disabled){border-color:#4299e1;background:#ebf8ff}
.choice-btn.correct{border-color:#48bb78;background:#f0fff4;color:#276749;font-weight:700}
.choice-btn.wrong{border-color:#fc8181;background:#fff5f5;color:#c53030}
.choice-btn:disabled{cursor:default}
.hint-box{margin-top:14px;padding:12px 16px;background:#ebf8ff;border-left:4px solid #4299e1;border-radius:0 8px 8px 0;font-size:.87rem;color:#2a4365;line-height:1.6;display:none}
.hint-box .hl{font-weight:700;display:block;margin-bottom:3px;font-size:.76rem;color:#2b6cb0}
.exp-box{margin-top:14px;padding:12px 16px;background:#fffbeb;border-left:4px solid #f6ad55;border-radius:0 8px 8px 0;font-size:.87rem;color:#7b341e;line-height:1.65;display:none}
.next-btn{margin-top:16px;width:100%;padding:13px;background:#4299e1;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;display:none}
.next-btn:hover{opacity:.9}
#result .r-title{font-size:1.2rem;font-weight:700;text-align:center;margin-bottom:16px}
.donut-wrap{display:flex;justify-content:center;align-items:center;gap:22px;margin-bottom:8px}
.donut-svg{width:110px;height:110px}
.score-big{font-size:2.2rem;font-weight:800;color:#2b6cb0;line-height:1}
.score-sub{font-size:.84rem;color:#718096}
.pass-badge{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:20px;font-size:.8rem;font-weight:700}
.pass-badge.pass{background:#f0fff4;color:#276749}
.pass-badge.fail{background:#fff5f5;color:#c53030}
.pass-note{text-align:center;font-size:.76rem;color:#a0aec0;margin-bottom:12px}
.sec-title{font-weight:700;margin:20px 0 9px;color:#2d3748;font-size:.96rem;padding-bottom:5px;border-bottom:2px solid #e2e8f0}
.sec-note{font-size:.76rem;color:#a0aec0;margin:-5px 0 9px;line-height:1.5}
.kc-list{display:flex;flex-direction:column;gap:7px}
.kc-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid #e2e8f0;border-radius:9px}
.kc-mark{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex-shrink:0;color:#fff}
.kc-mark.ok{background:#48bb78}.kc-mark.mid{background:#ed8936}.kc-mark.ng{background:#f56565}
.kc-body{flex:1;min-width:0}
.kc-name{font-size:.85rem;font-weight:600;line-height:1.4}
.kc-bar{height:5px;background:#edf2f7;border-radius:3px;margin-top:5px;overflow:hidden}
.kc-bar i{display:block;height:100%;border-radius:3px}
.kc-score{font-size:.77rem;color:#718096;white-space:nowrap}
.tag-list{display:flex;flex-direction:column;gap:8px}
.tag-row{padding:11px 13px;border-radius:9px;background:#fff5f5;border:1px solid #fed7d7}
.tag-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tag-name{font-size:.89rem;font-weight:700;color:#c53030}
.tag-count{font-size:.75rem;color:#e53e3e;white-space:nowrap}
.tag-advice{font-size:.81rem;color:#742a2a;margin-top:5px;line-height:1.55}
.empty{font-size:.84rem;color:#718096;padding:10px 0}
.todo{background:#ebf8ff;border:1px solid #bee3f8;border-radius:10px;padding:14px 16px;font-size:.87rem;color:#2a4365;line-height:1.7}
.todo b{color:#2b6cb0}
.sum-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.sum{border-collapse:collapse;font-size:.78rem;min-width:520px;width:100%}
table.sum th,table.sum td{border:1px solid #e2e8f0;padding:7px 9px;text-align:left;line-height:1.5;vertical-align:top}
table.sum thead th{background:#2b6cb0;color:#fff;font-weight:700;white-space:nowrap}
table.sum tbody th{background:#f7fafc;font-weight:700;white-space:nowrap;color:#2b6cb0}
.review-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding-right:4px}
.review-item{padding:11px 13px;border:1px solid #e2e8f0;border-radius:8px}
.review-item .rq{font-size:.86rem;font-weight:600;margin-bottom:4px;line-height:1.5}
.review-item .ra{font-size:.79rem;color:#718096;line-height:1.5}
.review-item.miss{border-color:#fed7d7;background:#fffafa}
.review-item.miss .rq{color:#c53030}
.review-item.half{border-color:#feebc8;background:#fffdf7}
.retry-btn{margin-top:18px;width:100%;padding:13px;background:linear-gradient(135deg,#4299e1,#3182ce);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer}
.retry-btn:hover{opacity:.9}
.home-link{display:block;text-align:center;margin-top:14px;color:#4299e1;font-size:.84rem;text-decoration:none}
.home-link:hover{text-decoration:underline}
.submit-status{margin-top:12px;text-align:center;font-size:.78rem;color:#a0aec0}
.hidden{display:none}
@media (max-width:480px){.card{padding:20px 16px}}
</style>
</head>
<body>
<div class="wrap">

<div id="start" class="card">
  <h1 id="uTitle"></h1>
  <p class="sub" id="uSub"></p>
  <div class="badges">
    <span class="badge key" id="totalBadge"></span>
    <span class="badge">毎回12問・正答率80%で合格</span>
    <span class="badge">ヒント→再挑戦</span>
    <span class="badge">ステップ分解採点</span>
  </div>
  <div class="flow">
    <b>基本 ×3</b><i>→</i><b>標準 ×4</b><i>→</i><b>段階（穴埋め）</b><i>→</i><b>発展 ×3</b><i>→</i><b>段階（自力）</b>
  </div>
  <div class="kc-preview">
    <div class="t">この回で測る力</div>
    <ul id="kcPreview"></ul>
  </div>
  <label class="id-label" for="studentId">学籍番号（学年・組・出席番号を半角4桁で／例：1年1組4番→1104）</label>
  <input class="id-input" id="studentId" placeholder="1104" inputmode="numeric" maxlength="4">
  <button class="start-btn" onclick="startQuiz()">スタート</button>
</div>

<div id="quiz" class="card hidden">
  <div class="header">
    <div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>
    <div class="q-num" id="qnum"></div>
  </div>
  <div class="meta-row" id="metaRow"></div>
  <div id="stemBox"></div>
  <div id="figBox"></div>
  <div id="stepDone" class="step-done"></div>
  <div id="qtext" class="q-text"></div>
  <div id="choices" class="choices"></div>
  <div id="hint" class="hint-box"></div>
  <div id="exp" class="exp-box"></div>
  <button id="nextBtn" class="next-btn" onclick="next()">次へ →</button>
</div>

<div id="result" class="card hidden">
  <div class="r-title">結果</div>
  <div class="donut-wrap">
    <svg class="donut-svg" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="15.9" fill="none" stroke="#e2e8f0" stroke-width="3.8"/>
      <circle id="donutArc" cx="18" cy="18" r="15.9" fill="none" stroke="#4299e1" stroke-width="3.8"
        stroke-dasharray="0 100" stroke-linecap="round" transform="rotate(-90 18 18)"/>
    </svg>
    <div>
      <div class="score-big" id="scoreBig"></div>
      <div class="score-sub" id="scoreSub"></div>
      <div class="pass-badge" id="passBadge"></div>
    </div>
  </div>
  <div class="pass-note">合格ライン：正答率80%（12点満点で9.5点以上）／ヒントを見て正解した問題は0.5点</div>

  <div class="sec-title">力ごとの定着</div>
  <div class="sec-note">◯＝ほぼ定着／△＝あと一歩／×＝要復習。本当の定着判定は「別の日に2回続けて正解」で行います。</div>
  <div class="kc-list" id="kcList"></div>

  <div class="sec-title">つまずきの型</div>
  <div class="sec-note">誤答の選択肢からミスの型を判定しています。</div>
  <div class="tag-list" id="tagList"></div>

  <div class="sec-title">次にやること</div>
  <div class="todo" id="todoBox"></div>

  <div id="sumSec"></div>

  <div class="sec-title">全問の解説</div>
  <div class="review-list" id="reviewList"></div>

  <button class="retry-btn" onclick="startQuiz()">もう一度チャレンジ</button>
  <div class="submit-status" id="submitStatus"></div>
  <a href="index.html" class="home-link">← クイズ一覧に戻る</a>
</div>

</div>

const PASS_RATE=0.8, N_L1=3, N_L2=4, N_L3=3;
let session=[], idx=0, records=[], studentId="", attempt=1;

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function el(id){return document.getElementById(id);}

function pickLevel(lv,n,used,usedKc){
  const pool=shuffle(POOL.map((it,i)=>i).filter(i=>POOL[i].lv===lv&&used.indexOf(i)<0));
  const out=[];
  // まだ出ていないKCを優先
  pool.forEach(i=>{ if(out.length<n && usedKc.indexOf(POOL[i].kc)<0){out.push(i);usedKc.push(POOL[i].kc);} });
  pool.forEach(i=>{ if(out.length<n && out.indexOf(i)<0) out.push(i); });
  out.forEach(i=>used.push(i));
  return out.slice(0,n);
}
function mkMcq(i){
  const it=POOL[i], order=shuffle(it.c.map((_,j)=>j));
  return {type:"mcq",src:it,order:order,a:order.indexOf(it.a)};
}
function mkStep(def){
  return {type:"step",src:def,sub:0,subResults:[],
    steps:def.steps.map(st=>{const o=shuffle(st.c.map((_,j)=>j));return {src:st,order:o,a:o.indexOf(st.a)};})};
}
function buildSession(){
  const used=[],usedKc=[];
  const l1=pickLevel(1,N_L1,used,usedKc), l2=pickLevel(2,N_L2,used,usedKc), l3=pickLevel(3,N_L3,used,usedKc);
  const fill=shuffle(STEPS.filter(s=>s.fill))[0], free=shuffle(STEPS.filter(s=>!s.fill))[0];
  const s=[];
  l1.forEach(i=>s.push(mkMcq(i)));
  l2.forEach(i=>s.push(mkMcq(i)));
  s.push(mkStep(fill));
  l3.forEach(i=>s.push(mkMcq(i)));
  s.push(mkStep(free));
  return s;
}

function toHalfWidthDigits(s){return s.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});}
function startQuiz(){
  studentId=toHalfWidthDigits((el('studentId').value||'').trim());
  if(!/^(20(0[0-9]|10)|1[1-6](0[1-9]|[1-3][0-9]|40))$/.test(studentId)){
    alert("学籍番号が正しくありません。\n1桁目は学年「1」、2桁目は組「1〜6」、3・4桁目は出席番号「01〜40」です（例：1年1組4番→1104）。");
    el('studentId').focus(); return;
  }
  el('studentId').value=studentId;
  try{localStorage.setItem('quizStudentId',studentId);}catch(e){}
  session=buildSession(); idx=0; records=[];
  el('start').classList.add('hidden'); el('result').classList.add('hidden');
  el('quiz').classList.remove('hidden');
  window.scrollTo(0,0); render();
}
function lvChip(lv){return `<span class="chip l${lv}">${lv===1?'基本':(lv===2?'標準':'発展')}</span>`;}
function figHtml(key){
  if(!key||!FIGS[key]) return '';
  return `<img class="qfig" src="${FIGS[key].src}" alt="${FIGS[key].alt}">`;
}

function render(){
  const item=session[idx]; attempt=1;
  el('pbar').style.width=(idx/session.length*100)+'%';
  el('qnum').textContent=`${idx+1} / ${session.length}`;
  el('hint').style.display='none'; el('exp').style.display='none';
  el('nextBtn').style.display='none';
  el('stepDone').innerHTML=''; el('stemBox').innerHTML=''; el('figBox').innerHTML='';
  if(item.type==='mcq'){
    const it=item.src;
    el('metaRow').innerHTML=`<span class="chip kc">${KC[it.kc].short}</span>${lvChip(it.lv)}`;
    el('figBox').innerHTML=figHtml(it.fig);
    el('qtext').innerHTML=it.q;
    el('choices').innerHTML=item.order.map((oi,k)=>
      `<button class="choice-btn" data-k="${k}" onclick="answerMcq(${k})">${it.c[oi].t}</button>`).join('');
  }else{ renderStep(); }
}
function renderStep(){
  const item=session[idx], def=item.src, st=item.steps[item.sub];
  el('metaRow').innerHTML=`<span class="chip kc">${KC[def.kc].short}</span>${lvChip(def.lv)}`+
    (def.fill?`<span class="chip fill">穴埋め（S1・S2 は提示）</span>`:`<span class="chip fill">ステップ分解</span>`);
  el('stemBox').innerHTML=`<div class="stem">${def.stem}</div>`;
  el('figBox').innerHTML=figHtml(def.fig);
  let done=(def.given||[]).map(g=>`<div class="step-row given"><span class="step-tag">${g.label}</span><span>${g.text}</span></div>`);
  item.subResults.forEach((r,i)=>{
    const s=item.steps[i];
    done.push(`<div class="step-row ${r.score<1?'miss':''}"><span class="step-tag">${s.src.label}</span><span>${s.src.c[s.src.a].t}${r.score<1?'　<b>（誤答→修正）</b>':''}</span></div>`);
  });
  el('stepDone').innerHTML=done.join('');
  el('qtext').innerHTML=`<span style="color:#6b46c1">［${st.src.label}］</span> ${st.src.q}`;
  el('choices').innerHTML=st.order.map((oi,k)=>
    `<button class="choice-btn" data-k="${k}" onclick="answerStep(${k})">${st.src.c[oi].t}</button>`).join('');
}
function judge(chosenK, srcQ, orderArr, correctK, onDone){
  const btns=[...el('choices').querySelectorAll('.choice-btn')];
  if(chosenK===correctK){
    btns.forEach(b=>b.disabled=true); btns[chosenK].classList.add('correct');
    onDone(attempt===1?1:0.5,null); showExp(srcQ); return;
  }
  const tag=srcQ.c[orderArr[chosenK]].tag||null;
  btns[chosenK].classList.add('wrong'); btns[chosenK].disabled=true;
  if(attempt===1){
    attempt=2;
    el('hint').innerHTML=`<span class="hl">ヒント</span>${srcQ.h}`;
    el('hint').style.display='block';
    onDone(null,tag);
  }else{
    btns.forEach(b=>b.disabled=true); btns[correctK].classList.add('correct');
    onDone(0,tag); showExp(srcQ);
  }
}
function showExp(srcQ){
  el('exp').innerHTML=`<b>解説</b>　${srcQ.e}`;
  el('exp').style.display='block';
  el('nextBtn').style.display='block';
  el('nextBtn').textContent=(idx===session.length-1&&!isMidStep())?'結果を見る →':'次へ →';
}
function isMidStep(){const it=session[idx];return it.type==='step'&&it.sub<it.steps.length-1;}
function answerMcq(k){
  const item=session[idx], it=item.src;
  if(!item.tags) item.tags=[];
  judge(k,it,item.order,item.a,(score,tag)=>{
    if(tag) item.tags.push(tag);
    if(score!==null) records.push({kc:it.kc,lv:it.lv,q:it.q,fig:it.fig,correct:it.c[it.a].t,score:score,tags:item.tags.slice(),exp:it.e,label:null});
  });
}
function answerStep(k){
  const item=session[idx], st=item.steps[item.sub];
  if(!st.tags) st.tags=[];
  judge(k,st.src,st.order,st.a,(score,tag)=>{
    if(tag) st.tags.push(tag);
    if(score!==null) item.subResults.push({score:score,tags:st.tags.slice()});
  });
}
function next(){
  const item=session[idx];
  if(item.type==='step'&&item.sub<item.steps.length-1){
    item.sub++; attempt=1;
    el('hint').style.display='none'; el('exp').style.display='none'; el('nextBtn').style.display='none';
    renderStep(); return;
  }
  if(item.type==='step'){
    const sc=item.subResults.map(r=>r.score);
    const avg=sc.reduce((a,b)=>a+b,0)/sc.length;
    const tags=item.subResults.reduce((a,r)=>a.concat(r.tags),[]);
    const detail=item.steps.map((s,i)=>`${s.src.label}：${item.subResults[i].score===1?'○':(item.subResults[i].score===0.5?'△':'×')}`).join('　');
    records.push({kc:item.src.kc,lv:item.src.lv,q:item.src.stem,fig:item.src.fig,correct:detail,score:avg,tags:tags,exp:item.steps[item.steps.length-1].src.e,label:'ステップ問題'});
  }
  idx++;
  if(idx>=session.length){ showResult(); return; }
  render();
}
function stripTags(x){return String(x).replace(/<[^>]+>/g,"");}
function send(pt,full){
  const st=el('submitStatus');
  if(!GAS_URL){ if(st) st.textContent="※送信先が未設定のため、この結果は記録されていません"; return; }
  const payload={studentId:studentId,quizName:UNIT.code+" "+UNIT.title,score:pt,total:full,
    passed:(full&&pt/full>=PASS_RATE)?"合格":"不合格",timestamp:new Date().toISOString(),
    missed:records.filter(r=>r.score<1).map(r=>stripTags(r.q))};
  try{
    fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(payload)});
    if(st) st.textContent="学籍番号: "+studentId+"｜記録しました";
  }catch(err){ if(st) st.textContent="※通信エラーのため記録できませんでした"; }
}
function showResult(){
  el('quiz').classList.add('hidden'); el('result').classList.remove('hidden');
  window.scrollTo(0,0);
  const total=records.length;
  const raw=records.reduce((a,r)=>a+r.score,0);
  const score=Math.round(raw*2)/2, rate=score/total;
  el('scoreBig').textContent=score+'点';
  el('scoreSub').textContent=`/ ${total}点（正答率 ${Math.round(rate*100)}%）`;
  el('donutArc').setAttribute('stroke-dasharray',`${(rate*100).toFixed(1)} ${(100-rate*100).toFixed(1)}`);
  const pass=rate>=PASS_RATE;
  const pb=el('passBadge');
  pb.textContent=pass?'合格':'もう一度'; pb.className='pass-badge '+(pass?'pass':'fail');

  const agg={};
  records.forEach(r=>{(agg[r.kc]=agg[r.kc]||{s:0,n:0});agg[r.kc].s+=r.score;agg[r.kc].n++;});
  el('kcList').innerHTML=Object.keys(KC).filter(k=>agg[k]).map(k=>{
    const p=agg[k].s/agg[k].n;
    const cls=p>=0.8?'ok':(p>=0.5?'mid':'ng'), mark=p>=0.8?'○':(p>=0.5?'△':'×');
    const col=p>=0.8?'#48bb78':(p>=0.5?'#ed8936':'#f56565');
    return `<div class="kc-row"><div class="kc-mark ${cls}">${mark}</div>
      <div class="kc-body"><div class="kc-name">${KC[k].name}</div>
      <div class="kc-bar"><i style="width:${Math.round(p*100)}%;background:${col}"></i></div></div>
      <div class="kc-score">${Math.round(agg[k].s*10)/10}/${agg[k].n}</div></div>`;
  }).join('');

  const tc={};
  records.forEach(r=>r.tags.forEach(t=>{tc[t]=(tc[t]||0)+1;}));
  const tags=Object.keys(tc).sort((a,b)=>tc[b]-tc[a]).slice(0,3);
  el('tagList').innerHTML=tags.length?tags.map(t=>
    `<div class="tag-row"><div class="tag-head"><span class="tag-name">${TAG[t].name}</span><span class="tag-count">${tc[t]}回</span></div>
     <div class="tag-advice">${TAG[t].advice}<br><span style="opacity:.7">戻る先：${KC[TAG[t].back].name}</span></div></div>`).join('')
    :`<div class="empty">今回、決まった型のミスは見つかりませんでした。</div>`;

  const weak=Object.keys(KC).filter(k=>agg[k]&&agg[k].s/agg[k].n<0.8);
  let todo='';
  if(pass&&weak.length===0){
    todo=`合格ラインを超え、測定したすべての力が8割に届いています。<b>3日後にもう一度</b>挑戦して、別の日に2回続けて合格できるか確かめましょう。それで「定着」と判定します。`;
  }else if(pass){
    todo=`合格ラインは超えています。ただし次の力はまだ8割に届いていません。<br>`+
      weak.map(k=>`・<b>${KC[k].name}</b>`).join('<br>')+`<br><br>次の回では、この力を優先して出題します。`;
  }else{
    todo=`合格ライン（正答率80%）に届きませんでした。まず次の力から復習しましょう。<br>`+
      weak.map(k=>`・<b>${KC[k].name}</b>`).join('<br>')+`<br><br><b>明日もう一度</b>、この回に挑戦してください。`;
  }
  if(tags.length) todo+=`<br><br>特に <b>${TAG[tags[0]].name}</b> の直し方を、板書ノートで確認しておくこと。`;
  el('todoBox').innerHTML=todo;

  el('sumSec').innerHTML = (typeof SUMMARY!=='undefined'&&SUMMARY)
    ? `<div class="sec-title">要点まとめ</div><div class="sum-wrap">${SUMMARY}</div>` : '';

  send(score,total);

  el('reviewList').innerHTML=records.map((r,i)=>{
    const cls=r.score===1?'':(r.score>0?'half':'miss');
    const mark=r.score===1?'○':(r.score>0?'△':'×');
    return `<div class="review-item ${cls}">
      <div class="rq">${mark} Q${i+1}${r.label?`（${r.label}）`:''}　${r.q}</div>
      <div class="ra"><b>正解：</b>${r.correct}<br>${r.exp}</div></div>`;
  }).join('');
}
</script>
